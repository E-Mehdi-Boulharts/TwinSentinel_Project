services:
  mcp-sumo:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mcp_sumo_server
    ports:
      - "8000:8000"
    environment:
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8000
      - SUMO_HOME=/usr/share/sumo
      - PYTHONUNBUFFERED=1
    volumes:
      - .:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    stdin_open: true
    tty: true
    restart: unless-stopped

  mcp-inspector:
    build:
      context: .
      dockerfile: Dockerfile.inspector
    container_name: mcp_inspector
    environment:
      - DANGEROUSLY_OMIT_AUTH=true
      - HOST=0.0.0.0
      - CLIENT_PORT=6274
      - PORT=6277
    depends_on:
      - mcp-sumo
    ports:
      - "6274:6274"
      - "6277:6277"
    restart: unless-stopped

  ollama:
    build:
      context: .
      dockerfile: Dockerfile.ollama
    container_name: ollama_server
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  ollama_data: